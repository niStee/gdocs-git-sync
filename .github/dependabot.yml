version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # init and analyze of github/codeql-action must move together; split PRs
    # fail individually. One weekly group for all actions.
    groups:
      github-actions:
        patterns: ["*"]
