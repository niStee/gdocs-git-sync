name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pyyaml requests
          pip install -e . || true
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Tests
        run: python -m unittest discover tests -v
