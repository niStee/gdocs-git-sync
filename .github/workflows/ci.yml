name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9dc2c8c94f57da07378229f23b14cca5 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pyyaml requests
          pip install -e . || true
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Tests
        run: python -m unittest discover tests -v
