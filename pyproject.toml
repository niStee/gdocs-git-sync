[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdocs-git-sync"
version = "0.1.0"
description = "Bi-directional synchronization between Google Docs and Git Markdown (Docs-as-Code)"
readme = "README.md"
authors = [{ name = "Nils Steenebruegge", email = "nils.steenebruegge@volteuropa.org" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0"
]

[project.scripts]
gdocs-sync = "gdocs_sync.cli:main"
